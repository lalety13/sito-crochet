# Configurazione Netlify: il sito è fatto di file statici nella cartella "sito".
# Non serve nessun comando di build.
[build]
  publish = "sito"

# Il file delle impostazioni viene sempre ricaricato, così prezzi e colori
# aggiornati sono visibili subito dopo la pubblicazione.
[[headers]]
  for = "/impostazioni.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
